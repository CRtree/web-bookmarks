<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--grad-a:#ff8a4a;--grad-b:#ff2f6e;--red:#ff4d4d;--line:#33353a;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:440px;height:280px;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;color:#f6f6f7;
    background:
      radial-gradient(340px 300px at 82% 0%, rgba(207,26,26,.22), transparent 60%),
      radial-gradient(360px 320px at 6% 108%, rgba(255,47,110,.14), transparent 62%),
      linear-gradient(135deg,#0f0f11 0%,#17171a 55%,#1b1b1e 100%);
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
  }
  /* bookmark icon */
  /* brand lockup: extension mark + "for YouTube™" */
  .lockup{display:flex;align-items:center;justify-content:center;gap:11px;}
  .mark{width:46px;height:46px;filter:drop-shadow(0 12px 22px rgba(255,60,110,.4));}
  .lockup .for{font-size:15px;font-style:italic;font-weight:500;color:#9a9ea6;}
  .lockup .yt{height:32px;width:auto;display:block;}
  .lockup .tm{font-size:9px;color:#9a9ea6;align-self:flex-start;margin-top:2px;}
  .brand{display:flex;align-items:center;gap:9px;margin-top:14px;}
  .brand .nm{font-size:26px;font-weight:800;letter-spacing:-.02em;}
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);}
  h1{margin-top:11px;font-size:20px;font-weight:700;letter-spacing:-.01em;}
  h1 .hl{background:linear-gradient(92deg,var(--grad-a),var(--grad-b));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{margin-top:8px;font-size:12.5px;color:#a9adb4;line-height:1.45;max-width:330px;}
  .feat{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:12px;font-weight:600;color:#e6e8ec;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    padding:8px 15px;border-radius:999px;}
  .feat .ck{width:15px;height:15px;border-radius:50%;flex:none;color:#0f0f11;font-size:10px;font-weight:800;
    display:inline-flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--grad-a),var(--grad-b));}
  /* soft glow behind center */
  .halo{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:380px;height:300px;
    background:radial-gradient(closest-side,rgba(255,60,110,.12),transparent);pointer-events:none;}
</style>
</head>
<body>
  <div class="halo"></div>
  <div class="lockup">
    <svg class="mark" viewBox="0 0 24 24"><path d="M6 2.5h12a1.5 1.5 0 0 1 1.5 1.5v17a.8.8 0 0 1-1.3.62L12 16.5l-6.2 5.12A.8.8 0 0 1 4.5 21V4A1.5 1.5 0 0 1 6 2.5Z" fill="url(#g)"/><rect x="9" y="6" width="6" height="2.4" rx="1.2" fill="#fff" opacity=".9"/><defs><linearGradient id="g" x1="6" y1="3" x2="18" y2="21"><stop stop-color="#ff8a4a"/><stop offset="1" stop-color="#ff2f6e"/></linearGradient></defs></svg>
    <span class="for">for</span>
    <!-- Official YouTube logo, white wordmark variant, used unmodified to
         indicate compatibility. See assets/README.md. -->
    <img class="yt" src="assets/youtube-logo-white.svg" alt="YouTube">
    <span class="tm">™</span>
  </div>
  <div class="brand"><span class="nm">Scroll Saver</span></div>
  <h1>Never lose your <span class="hl">spot</span> on YouTube</h1>
  <p class="sub">Remembers the video you clicked on any channel and brings you right back.</p>
  <span class="feat"><span class="ck">✓</span>Videos, Shorts &amp; every channel</span>
</body>
</html>
