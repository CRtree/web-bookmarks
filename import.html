<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Import saved positions - Youtube Scroll Saver</title>
  <style>
    :root {
      --bg: #f4f5f6;
      --surface: #ffffff;
      --text: #16181a;
      --text-2: #4a4f55;
      --text-3: #7a828b;
      --border: #e2e5e8;
      --accent: #cf1a1a;
      --accent-soft: rgba(207, 26, 26, 0.08);
      --success: #14804a;
      --success-soft: #e6f4ec;
      --success-ring: rgba(20, 128, 74, 0.20);
      --danger: #c5221f;
      --danger-soft: #fdecec;
      --shadow: 0 18px 50px rgba(15, 20, 25, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181a;
        --surface: #232528;
        --text: #f2f3f4;
        --text-2: #b9bfc6;
        --text-3: #868d95;
        --border: #36393d;
        --accent: #ff6b6b;
        --accent-soft: rgba(255, 107, 107, 0.12);
        --success: #74d99f;
        --success-soft: rgba(116, 217, 159, 0.12);
        --success-ring: rgba(116, 217, 159, 0.24);
        --danger: #f28b82;
        --danger-soft: rgba(242, 139, 130, 0.12);
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 28px 26px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .card.is-success {
      border-color: var(--success-ring);
      box-shadow: var(--shadow), 0 0 0 3px var(--success-soft);
    }

    .card.is-error {
      border-color: var(--danger-soft);
      box-shadow: var(--shadow), 0 0 0 3px var(--danger-soft);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .lede {
      margin: 0 0 20px;
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--text-2);
    }

    code {
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
    }

    /* ---- States ---- */

    .state {
      animation: stateIn 0.32s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }

    /* The hidden attribute must beat .state.center's flex display. */
    .state[hidden] {
      display: none !important;
    }

    .state.center {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    @keyframes stateIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ---- Drop zone ---- */

    .drop {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 26px 16px;
      text-align: center;
      cursor: pointer;
      border: 1.5px dashed var(--border);
      border-radius: 14px;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }

    .drop:hover,
    .drop.dragover {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    .drop-icon {
      width: 26px;
      height: 26px;
      margin-bottom: 7px;
      color: var(--text-3);
      transition: color 0.15s ease;
    }

    .drop:hover .drop-icon,
    .drop.dragover .drop-icon {
      color: var(--accent);
    }

    .drop strong {
      font-size: 14px;
    }

    .drop span {
      font-size: 12.5px;
      color: var(--text-3);
    }

    input[type="file"] {
      display: none;
    }

    /* ---- Working ---- */

    .spinner {
      width: 44px;
      height: 44px;
      margin-bottom: 18px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ---- Result ---- */

    .result-badge {
      position: relative;
      display: grid;
      place-items: center;
      width: 78px;
      height: 78px;
      margin-bottom: 18px;
      border-radius: 50%;
      animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .result-badge svg {
      width: 38px;
      height: 38px;
    }

    .result-badge.success {
      color: var(--success);
      background: var(--success-soft);
    }

    .result-badge.error {
      color: var(--danger);
      background: var(--danger-soft);
    }

    .result-badge.success::after {
      content: "";
      position: absolute;
      inset: -1px;
      border: 2px solid var(--success-ring);
      border-radius: 50%;
      animation: ring 0.9s ease-out 0.12s both;
    }

    .result-badge .check {
      stroke-dasharray: 32;
      stroke-dashoffset: 32;
      animation: draw 0.5s cubic-bezier(0.65, 0, 0.35, 1) 0.18s forwards;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(0.5);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes ring {
      from {
        opacity: 1;
        transform: scale(1);
      }
      to {
        opacity: 0;
        transform: scale(1.35);
      }
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    .result-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    /* The number is the payload: large, colored, and unmissable. */
    .result-count {
      margin-top: 10px;
      color: var(--success);
      font-size: 54px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }

    .result-unit {
      margin-top: 4px;
      font-size: 13px;
      color: var(--text-2);
    }

    .result-detail {
      margin: 14px 0 0;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-3);
    }

    .result-detail:empty {
      display: none;
    }

    .state.center .result-detail {
      max-width: 30ch;
    }

    /* ---- Actions ---- */

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
      margin-top: 24px;
    }

    .btn {
      padding: 10px 18px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.primary {
      background: var(--text);
      color: var(--surface);
    }

    .btn.primary:hover {
      opacity: 0.88;
    }

    .btn.ghost {
      border-color: var(--border);
      color: var(--text-2);
    }

    .btn.ghost:hover {
      border-color: var(--text-3);
      color: var(--text);
    }

    @media (prefers-reduced-motion: reduce) {

      .state,
      .result-badge,
      .result-badge::after,
      .spinner {
        animation: none !important;
      }

      .result-badge .check {
        animation: none !important;
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>

<body>
  <main class="card" id="card">

    <!-- Idle: choose a file -->
    <section class="state" id="state-idle">
      <h1>Import saved positions</h1>
      <p class="lede">
        Choose a <code>scroll-saver-positions-*.json</code> file exported from Youtube Scroll Saver.
        Positions with the same URL are updated, and the imported channels are enabled so they can restore.
      </p>
      <label class="drop" id="drop" for="file">
        <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 16V4" />
          <path d="m7 9 5-5 5 5" />
          <path d="M4 20h16" />
        </svg>
        <strong>Choose a file</strong>
        <span>or drag &amp; drop it here</span>
      </label>
      <input id="file" type="file" accept="application/json,.json">
    </section>

    <!-- Working -->
    <section class="state center" id="state-working" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <h1 class="result-title">Importing&hellip;</h1>
      <p class="result-detail" id="working-name"></p>
    </section>

    <!-- Success -->
    <section class="state center" id="state-success" hidden>
      <div class="result-badge success" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path class="check" d="M20 6 9 17l-5-5" />
        </svg>
      </div>
      <h1 class="result-title">Import complete</h1>
      <div class="result-count"><span id="imported-count">0</span></div>
      <div class="result-unit" id="imported-label">positions imported</div>
      <p class="result-detail" id="success-detail"></p>
      <div class="actions">
        <button id="again" type="button" class="btn ghost">Import another file</button>
        <button id="close" type="button" class="btn primary">Done</button>
      </div>
    </section>

    <!-- Error -->
    <section class="state center" id="state-error" hidden>
      <div class="result-badge error" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 7v6" />
          <path d="M12 17h.01" />
        </svg>
      </div>
      <h1 class="result-title">Import failed</h1>
      <p class="result-detail" id="error-detail"></p>
      <div class="actions">
        <button id="retry" type="button" class="btn primary">Try again</button>
      </div>
    </section>

  </main>

  <script src="import.js"></script>
</body>

</html>
