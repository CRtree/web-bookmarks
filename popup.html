<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Youtube Scroll Saver</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body data-layout="modern">
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <div class="brand-text">
          <span class="brand-name">Scroll Saver</span>
          <span class="tagline">ADD the YouTube channel you want to remember.</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="export-log" class="icon-btn" title="Export logs">⤓</button>
        <button id="layout-toggle" class="icon-btn" title="Switch to the extended layout">☰</button>
        <button id="theme-toggle" class="icon-btn" title="Toggle theme">☾</button>
      </div>
    </header>

    <main class="columns">

      <section class="panel current">
        <div class="panel-head">
          <span class="panel-label">Current</span>
          <button id="add-page" class="btn-add">Add</button>
        </div>
        <div id="current-info" class="current-info">
          <p class="entry-loading">Loading&hellip;</p>
        </div>
        <div class="current-actions">
          <button id="refresh" class="btn">↻ Refresh</button>
        </div>
      </section>

      <section class="panel stored">
        <div class="panel-head">
          <span class="panel-label">Stored</span>
          <div class="panel-head-right">
            <span class="card-count"><span id="stats-count">0</span> saved</span>
            <button id="clear-all" class="link">Delete all</button>
          </div>
        </div>
        <div id="positions-list" class="stored-list">
          <p class="empty-state">No saved positions yet</p>
        </div>
      </section>

    </main>

  </div>

  <script src="popup.js"></script>
</body>

</html>
