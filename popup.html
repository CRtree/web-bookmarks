<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Youtube Scroll Saver</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body data-layout="modern">
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <div class="brand-text">
          <span class="brand-name">Scroll Saver</span>
          <span class="tagline">ADD the YouTube channel you want to remember.</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="export-log" class="icon-btn" title="Export logs">⤓</button>
        <button id="layout-toggle" class="icon-btn" title="Switch to the extended layout">☰</button>
        <button id="theme-toggle" class="icon-btn" title="Toggle theme">☾</button>
      </div>
    </header>

    <main class="columns">

      <section class="panel current">
        <div class="panel-head">
          <span class="panel-label">Current</span>
          <div class="panel-head-right">
            <button id="refresh" class="btn" title="Refresh" aria-label="Refresh">↻</button>
            <button id="add-page" class="btn-add">Add</button>
          </div>
        </div>
        <div id="current-info" class="current-info">
          <p class="entry-loading">Loading&hellip;</p>
        </div>
      </section>

      <section class="panel stored">
        <div class="panel-head">
          <div class="panel-head-left">
            <span class="panel-label">Stored</span>
            <span class="card-count"><span id="stats-count">0</span> saved</span>
          </div>
          <div class="header-actions">
            <button id="export-positions" class="header-icon" title="Export saved positions to a JSON file" aria-label="Export saved positions">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
            </button>
            <button id="import-positions" class="header-icon" title="Import saved positions from a JSON file" aria-label="Import saved positions">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></svg>
            </button>
            <button id="clear-all" class="header-icon danger" title="Delete all saved positions" aria-label="Delete all saved positions">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
            </button>
          </div>
        </div>
        <div id="positions-list" class="stored-list">
          <p class="empty-state">No saved positions yet</p>
        </div>
      </section>

    </main>

  </div>

  <script src="popup.js"></script>
</body>

</html>
