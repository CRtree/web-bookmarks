<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Youtube Scroll Saver</title>
  <link rel="stylesheet" href="popup-classic.css">
</head>

<body data-layout="classic">
  <div class="container">

    <header class="masthead">
      <h1 class="masthead-title">Youtube Scroll Saver</h1>
      <div class="masthead-rule"></div>
      <p class="masthead-tagline">ADD the channel you want to remember.</p>
    </header>

    <section class="card">
      <div class="card-header">
        <h2 class="card-label">Current Page</h2>
        <div class="card-header-right">
          <button id="refresh" class="btn">Refresh</button>
          <button id="add-page" class="btn btn-add">Add</button>
        </div>
      </div>
      <div class="card-body">
        <div id="current-info">
          <p class="entry-loading">Loading&hellip;</p>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <div class="card-header-left">
          <h2 class="card-label">Stored</h2>
          <span class="card-count"><span id="stats-count">0</span> positions</span>
        </div>
        <div class="header-actions">
          <button id="export-positions" class="header-icon" title="Export saved positions to a JSON file" aria-label="Export saved positions">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          </button>
          <button id="import-positions" class="header-icon" title="Import saved positions from a JSON file" aria-label="Import saved positions">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></svg>
          </button>
          <button id="clear-all" class="header-icon danger" title="Delete all saved positions" aria-label="Delete all saved positions">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          </button>
        </div>
      </div>
      <div id="positions-list">
        <p class="empty-state">No saved positions yet</p>
      </div>
    </section>

    <div class="toolbar">
      <button id="export-log" class="btn btn-utility">Export Log</button>
      <button id="layout-toggle" class="btn btn-utility" title="Switch to the compact layout">Compact</button>
      <button id="theme-toggle" class="btn btn-utility">Dark</button>
    </div>

  </div>

  <script src="popup.js"></script>
</body>

</html>
